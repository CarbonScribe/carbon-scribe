name: Verifiable Registry CI
on:
  push:
    paths:
      - 'stellar-core/verifiable-registry/**'
      - 'stellar-core/carbon-asset-factory/contracts/carbon_asset/**'
      # carbon_asset's own WASM (built below) now embeds buffer_pool's
      # contractimport!-read spec indirectly, so a buffer_pool-only change
      # needs this workflow to re-run too (#684/#753).
      - 'stellar-core/carbon-asset-factory/contracts/buffer_pool/**'
  pull_request:
    paths:
      - 'stellar-core/verifiable-registry/**'
      - 'stellar-core/carbon-asset-factory/contracts/carbon_asset/**'
      - 'stellar-core/carbon-asset-factory/contracts/buffer_pool/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar-core/verifiable-registry

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # carbon_asset (#684) itself imports buffer_pool's compiled WASM via
      # soroban_sdk::contractimport!, so building carbon_asset's own WASM
      # (the next step) requires buffer_pool's WASM to already exist on
      # disk — this has to run before it, for the same reason the next step
      # has to run before merkle_bridge's build.
      - name: Build buffer_pool WASM (transitive dependency for carbon_asset)
        working-directory: stellar-core/carbon-asset-factory
        run: cargo build -p buffer_pool --target wasm32-unknown-unknown --release --verbose

      # merkle_bridge (#521) imports carbon_asset's compiled WASM via
      # soroban_sdk::contractimport! for a typed cross-contract mint call.
      # carbon_asset lives in the separate carbon-asset-factory workspace, so
      # its WASM has to be built here first — contractimport! only reads a
      # file off disk, it isn't a Cargo dependency, so nothing else builds it.
      - name: Build carbon_asset WASM (dependency for merkle_bridge)
        working-directory: stellar-core/carbon-asset-factory
        run: cargo build -p carbon_asset --target wasm32-unknown-unknown --release --verbose

      - name: Verify Rust project
        run: |
          if [ ! -f "Cargo.toml" ]; then
            echo "❌ ERROR: No Cargo.toml file found"
            exit 1
          fi
          echo "✅ Rust project verified"

      - name: Check
        run: cargo check --verbose
        continue-on-error: false

      - name: Test
        run: cargo test --verbose