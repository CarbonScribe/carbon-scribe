[package]
name = "carbon_asset"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
# Buffer pool cross-contract integration (issue #684): mint() calls
# buffer_pool's auto_deposit via its generated Client when a buffer pool
# address is configured.
buffer_pool = { path = "../buffer_pool" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
