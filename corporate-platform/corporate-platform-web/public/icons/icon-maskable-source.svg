  <defs>
    <linearGradient id="grad-maskable" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#1a5db5"/>
